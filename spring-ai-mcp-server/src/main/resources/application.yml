server:
  # 与订单助手的8080端口分开。
  port: 8090
  # 本机访问。
  address: 127.0.0.1

spring:
  application:
    name: spring-ai-mcp-server
  #数据链接
  datasource:
    url: ${SPRING_AI_DB_URL}
    username: ${SPRING_AI_DB_USERNAME}
    password: ${SPRING_AI_DB_PASSWORD}
  #mcp服务端配置
  ai:
    mcp:
      server:
        name: time-mcp-server
        version: 1.0.0
        # 使用同步Java方法处理工具调用。
        type: SYNC
        # 使用无状态的HTTP服务方式。
        protocol: STATELESS
        stateless:
          mcp-endpoint: /mcp
app:
  mcp:
    # 仅用于当前本机练习，两端必须一致。
    service-token: mcp-service-demo-token-local-only-20261029
mybatis:
  # 扫描当前模块及依赖模块中的Mapper XML。
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 单条SQL的超时时间，单位为秒。
    default-statement-timeout: 5