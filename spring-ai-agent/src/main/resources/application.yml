server:
  # 业务接口端口。
  port: 8080

# 开启健康检查以及获取指标
management:
  server:
    # 监控接口使用独立端口，仅允许本机访问。
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics

spring:
  profiles:
    active: prod

  application:
    name: spring-ai-agent

  datasource:
    # 实际连接信息由运行环境提供。
    url: ${SPRING_AI_DB_URL}
    username: ${SPRING_AI_DB_USERNAME}
    password: ${SPRING_AI_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: SpringAiHikariPool
      minimum-idle: 1
      maximum-pool-size: 5
      # 从连接池获取连接，最多等待30秒。
      connection-timeout: 30000
      # 验证连接是否有效，最多等待5秒。
      validation-timeout: 5000

  ai:
    tools:
      # 工具执行失败时抛出异常，由后端统一处理。
      throw-exception-on-error: true

    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      # 从环境变量读取百炼API Key。
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1

      # 模型HTTP请求的超时限制。
      timeout: 30s
      # 符合重试条件的失败，最多额外重试一次。
      max-retries: 1

      chat:
        model: qwen-flash
        temperature: 0.7
        max-tokens: 512
        extra-body:
          enable_thinking: false

      embedding:
        model: text-embedding-v4
        dimensions: 1024
        timeout: 30s
        max-retries: 2

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST}
        # Qdrant的gRPC端口。
        port: 6334
        api-key: ${QDRANT_API_KEY}
        collection-name: trade_order_knowledge
        content-field-name: doc_content
        # 保持当前项目的连接方式。
        use-tls: false

    chat:
      memory:
        repository:
          jdbc:
            platform: mysql
    mcp:
      client:
        name: order-agent-mcp-client
        type: SYNC
        request-timeout: 10s

        # 启动时建立客户端并完成协议初始化。
        initialized: true

        # 将远端工具注册给模型
        toolcallback:
          enabled: true

        streamable-http:
          connections:
            mdc-server-1:
              url: http://127.0.0.1:8090
              endpoint: /mcp
mybatis:
  # 扫描当前模块及依赖模块中的Mapper XML。
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 单条SQL的超时时间，单位为秒。
    default-statement-timeout: 5
#负责显示MDC设置的日志requestId
logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
app:
  mcp:
    # 仅用于当前本机练习，两端必须一致。
    service-token: mcp-service-demo-token-local-only-20261029