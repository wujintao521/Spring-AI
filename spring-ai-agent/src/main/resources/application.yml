server:
  # Web 服务端口
  port: 8080

spring:
  application:
    # 当前应用名称
    name: spring-ai-agent
  datasource:
    url: ${SPRING_AI_DB_URL}
    username: ${SPRING_AI_DB_USERNAME}
    password: ${SPRING_AI_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: SpringAiHikariPool
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000
      validation-timeout: 5000
  ai:
    tools:
      # Tool执行失败时抛出异常，由后端统一异常处理
      throw-exception-on-error: true
    model:
      # 开启 OpenAI 协议的聊天模型
      chat: openai
      # 暂时不创建向量模型
      embedding: none
      # 暂时不创建图片生成模型
      image: none
      # 暂时不创建内容审核模型
      moderation: none
      # 暂时不创建语音模型
      audio:
        speech: none
        transcription: none
    openai:
      # 从 Windows 环境变量读取百炼 API Key
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        # 实际调用的千问模型
        model: qwen-flash
        # 控制回答随机性，越低越稳定
        temperature: 0.7
        # 限制单次回复长度
        max-tokens: 512
        # 关闭思考模式
        extra-body:
          enable_thinking: false
    # 通过MySQL存储会话记忆
    chat:
      memory:
        repository:
          jdbc:
            # 自动创建会话记忆表
            initialize-schema: always
            # 使用Spring AI内置的MySQL建表脚本
            platform: mysql

mybatis:
  # classpath* 可以扫描依赖模块 common-dao 中的 XML
  mapper-locations: classpath*:mapper/**/*.xml

  configuration:
    # 自动把数据库的 order_no 映射成 Java 的 orderNo
    map-underscore-to-camel-case: true